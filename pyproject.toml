[build-system]
requires = ["setuptools>=64", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "dabest"
dynamic = ["version"]
description = "Data Analysis and Visualization using Bootstrap-Coupled Estimation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Joses W. Ho", email = "joseshowh@gmail.com"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = ['fastcore', 'pandas~=2.2.3', 'numpy~=2.1.0', 'matplotlib~=3.10.0', 'seaborn~=0.13.2', 'scipy~=1.15.2', 'numba~=0.61.0', 'datetime', 'statsmodels', 'lqrt', 'tqdm']

[project.urls]
Repository = "https://github.com/acclab/DABEST-python"
Documentation = "https://acclab.github.io/DABEST-python"

[project.entry-points.nbdev]
dabest = "dabest._modidx:d"

[project.optional-dependencies]
dev = ['pytest~=8.3.4', 'pytest-mpl~=0.17.0']

[tool.setuptools.dynamic]
version = {attr = "dabest.__version__"}

[tool.setuptools.packages.find]
include = ["dabest", "dabest.*"]

[tool.nbdev]
branch = 'master'
readme_nb = 'read_me.ipynb'
jupyter_hooks = true
custom_sidebar = true
title = 'dabest'
